[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comass-xarm7-rl"
version = "0.1.0"
description = "Goal- and object-conditioned xArm7 throwing with its native gripper"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "mujoco>=3.2,<4", "PyOpenGL>=3.1.7", "gymnasium>=1.1,<2", "torch>=2.2", "PyYAML>=6", "trimesh>=4", "imageio[ffmpeg]>=2.30"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
xarm7-train = "xarm7_rl.train:main"
xarm7-eval = "xarm7_rl.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xarm7_rl = ["assets/ufactory_xarm7/*.xml", "assets/ufactory_xarm7/SOURCE.json", "assets/ufactory_xarm7/LICENSE", "assets/ufactory_xarm7/assets/*.stl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
